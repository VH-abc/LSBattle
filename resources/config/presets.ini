# Settings presets: one per line, applied with keys 1-9 in game or from the Settings menu.
# name | ACCEL=c/s | TIME_RATE=x | optional: IMPULSE_RAPIDITY= GRAVITY= ORBITS= GLARE= CMB= IMPULSE= EXPOSURE= COLOR_MODE=
#
# Presets 2, 3, 5 and 6 share one recipe at time rate 1: thrust reaches Lorentz
# factor 2 after accelerating over half the home planet's orbital radius, and the
# trip from the planet to the star's surface, rest to rest without gravity, takes
# 20 s.  With that recipe the planet's orbit is 4.77/v_orbit times the trip, so
# only a planet moving at a good fraction of c orbits in minutes.
#  2  the real Sun from Earth (time rate 32, since the Sun is far)
#  3  Forge/Cinder: a 205,000-solar-mass star of three Schwarzschild radii, Cinder at
#     nine (0.24c, 8-minute orbit); surface gravity a quarter of the thrust, so you
#     can hover and land.  1200 light-years out.
#  5  Helios: a Sun twin with eight planets 2000 light-years out; Ember at 7 solar
#     radii orbits in 2.1 days (a real-density star makes it slow).
#  6  Abyss: a 280,000-solar-mass black hole 2500 light-years out, Ash at 5.5
#     Schwarzschild radii (0.30c, 5.3-minute orbit), Tar and Slag further out.
#     No resting there: orbit it.  Horizon crossing strands the ship.
# Preset 4, interstellar: 3 g of thrust at 2e6x; Proxima in ~27 player-s, Sgr A* in
# ~2 min, Andromeda in ~3 min, rest to rest, with the time dilation to match.
# Boost rapidity is one player-second of acceleration (ACCEL x TIME_RATE).
# Preset 8, null rotation: thrust 1.8 c/s equals the arrow-key turn rate of 1.8 rad/s
# (inertia off so the rate is exact), so holding thrust and an arrow together gives
# a rotating proper acceleration whose generator is null: a + omega x c = 0.
# Preset 9: 1 c/s in real time; boost rapidity 1 (one second of thrust).
Solar system continuous rocket | ACCEL=1e-11 | TIME_RATE=5e5 | IMPULSE_RAPIDITY=5e-6
Sun in 20 s, gamma 2 at half AU | ACCEL=4e-3 | TIME_RATE=32 | IMPULSE_RAPIDITY=0.128
Cinder system, gravity on | ACCEL=0.1099 | TIME_RATE=1 | IMPULSE_RAPIDITY=0.1099 | GRAVITY=1 | ORBITS=1
Interstellar, 3 g | ACCEL=1e-7 | TIME_RATE=2e6 | IMPULSE_RAPIDITY=0.2
Helios system, gravity on | ACCEL=0.123 | TIME_RATE=1 | IMPULSE_RAPIDITY=0.123 | GRAVITY=1 | ORBITS=1
